version: 2.1

jobs:
  ci-text-misc:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build v2
          command: |
            mkdir -p /tmp/foundry2
            set +o pipefail 2>/dev/null; > /tmp/foundry2/east575; dd if=/dev/urandom bs=1 count=10000 2>/dev/null >> /tmp/foundry2/east575; true
            sha1sum /tmp/foundry2/east575 | awk '{print "sha1:",substr($1,1,10)}'
      - persist_to_workspace:
          root: /tmp/foundry2
          paths:
            - 'east575'
  ga-v2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/foundry2
      - run:
          name: Pull upstream blob
          command: |
            awk 'BEGIN{ORS=""} 1' /tmp/foundry2/_wip-90225e 2>/dev/null | wc -c || true
      - run:
          name: Clone workspace
          command: git clone --depth 5 -q --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load fixtures
          command: tar --extract --xz --file=final-notes-v4.tar.xz
      - run:
          command: bash -c "./grab-v5"
